      <h2>The longer read</h2>
      <h4>Where it came from</h4>
      <p>Camus grew up poor in Algiers, raised by a mother who was nearly deaf and could barely read. He knew sunlight, the sea and football long before he knew philosophy, and he never trusted any idea that asked him to give up the world for something beyond it.</p>
      <p>He wrote <em>The Myth of Sisyphus</em> in 1940 and 1941, as France fell to Germany, and it was published in occupied Paris in 1942, the same year as his novel <em>The Stranger</em>. The question of whether a life could still be worth living was not abstract to anyone reading it.</p>
      <h4>The argument</h4>
      <p>He opens with what he calls the one truly serious philosophical problem: whether life is worth living at all. Everything else, he says, comes after.</p>
      <p>The absurd is not in the world, and not in us, but in the confrontation between the two. Once you have seen it, he argues, there are three ways to respond. You can end your life, which settles the confrontation by giving in to it. You can take a leap of faith toward a meaning beyond this world, which he calls <em>philosophical suicide</em>, because it gives up on clear sight. Or you can stay inside the contradiction, eyes open, and keep living.</p>
      <p>That third way is revolt. It brings with it a strange freedom, since nothing is owed and nothing is promised, and a passion to live as fully and as much as possible.</p>
      <h4>What changed</h4>
      <p>In <em>The Rebel</em> (1951) Camus carried revolt from the single person to the community: my refusal of injustice becomes something we share. The book cost him his friendship with Sartre, who thought it naive about revolution. Camus won the Nobel Prize in 1957 and died in a car accident in 1960, aged 46, with an unfinished novel about his childhood in his briefcase.</p>
    </div>

  </section>

      <h2>The original words</h2>
      <p>Hemingway took his title from the opening of Ecclesiastes, written more than two thousand years ago. It is the same cry Camus heard: labour, repetition, and a world that does not answer.</p>
      <div class="scripture">
        <sup>2</sup>Vanity of vanities, saith the Preacher, vanity of vanities; all is vanity.<br>
        <sup>3</sup>What profit hath a man of all his labour which he taketh under the sun?<br>
        <sup>4</sup>One generation passeth away, and another generation cometh: but the earth abideth for ever.<br>
        <sup>5</sup>The sun also ariseth, and the sun goeth down, and hasteth to his place where he arose.<br>
        <sup>7</sup>All the rivers run into the sea; yet the sea is not full; unto the place from whence the rivers come, thither they return again.<br>
        <sup>9</sup>The thing that hath been, it is that which shall be; and that which is done is that which shall be done: and there is no new thing under the sun.
      </div>
      <div class="src">Ecclesiastes 1, King James Version (1611)</div>
      <p>For Camus in his own words, read the final chapter of <em>The Myth of Sisyphus</em>, called "The Myth of Sisyphus". It is about eight pages, and it is where the line about imagining Sisyphus happy comes from.</p>
    </div>

  </section>

  <section class="screen text">

      <h2>The best objection</h2>
      <div class="card-sm">
        <div class="who">Kierkegaard</div>
        <div class="what">THE LEAP IS NOT A RETREAT</div>
        <p>Camus calls faith philosophical suicide. Kierkegaard, writing a century earlier, would answer that refusing the leap is its own kind of despair: a self that insists on standing alone, proud of carrying a rock it was never meant to carry alone.</p>
      </div>
      <div class="card-sm">
        <div class="who">Thomas Nagel</div>
        <div class="what">"THE ABSURD", 1971</div>
        <p>The absurd is not a cosmic injustice, Nagel argues. It comes from our ability to step back and see our own lives from outside. So defiance makes too much of it. The fitting response is irony, taking our lives seriously while knowing we could doubt them.</p>
      </div>
      <div class="label" style="margin-top:20px">Who's closest to right?</div>

      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(peak, when + 0.006);
      g.gain.exponentialRampToValueAtTime(peak * 0.35, when + 0.25 / (k + 1));
      g.gain.exponentialRampToValueAtTime(0.0001, when + decay / (1 + k * 0.6));
      o.connect(g); g.connect(bus);
      o.start(when); o.stop(when + decay + 0.1);
    });
  }
  function strings(freq, when, dur){
    [-6, 5].forEach(det => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq; o.detune.value = det;
      const vib = ctx.createOscillator(), vg = ctx.createGain(); vib.frequency.value = 4.6; vg.gain.value = freq * 0.004;
      vib.connect(vg); vg.connect(o.frequency);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 650; f.Q.value = 0.7;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(0.018, when + dur * 0.5);
      g.gain.linearRampToValueAtTime(0, when + dur * 1.05);
      o.connect(f); f.connect(g); g.connect(verbBus); g.connect(bus);
      o.start(when); vib.start(when); o.stop(when + dur * 1.1); vib.stop(when + dur * 1.1);
    });
  }
  function playChord(){
    if (!playing) return;
    const c = SOUND.chords[step % SOUND.chords.length];
    const now = ctx.currentTime + 0.1, b = SOUND.beat, barLen = b * 8, total = barLen * 2;
    piano(c.bass, now, 0.55);
    if (step % 4 === 3) piano(c.bass * 2, now + barLen, 0.4);
    c.strings.forEach(f => strings(f, now, total + 1));
    for (let bar = 0; bar < 2; bar++){
      const pat = PATTERNS[(step + bar + SOUND.pattern) % PATTERNS.length];
      pat.forEach((idx, i) => {
        if (idx === null) return;
        const t = now + bar * barLen + i * b + (Math.random() - 0.5) * 0.03 + (i === 7 ? 0.08 : 0);
        piano(c.arp[idx], t, (i === 0 ? 0.7 : 0.45) + Math.random() * 0.15);
      });
    }
    step++;
    timers.push(setTimeout(playChord, total * 1000));
  }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
  async function start(){
    if (!ctx && !setup()) return;
    if (ctx.state === 'suspended') await ctx.resume();
    playing = true; renderSound();
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(1, ctx.currentTime, 1.5);
    playChord();
  }
  function stop(){
    if (!ctx) return;
    playing = false; renderSound(); clearTimers();
    master.gain.setTargetAtTime(0, ctx.currentTime, 0.8);
  }
  function setSound(card){
    SOUND = profile(card ? card.sound : null); step = 0;
    if (playing && ctx) {
      clearTimers();
      master.gain.setTargetAtTime(0.15, ctx.currentTime, 0.4);
      timers.push(setTimeout(() => { if (!playing) return; master.gain.setTargetAtTime(1, ctx.currentTime, 1.5); playChord(); }, 1200));
    }
  }
  function renderSound(){
    $('sound').classList.toggle('playing', playing);
    $('sound').setAttribute('aria-pressed', String(playing));
    $('sound').setAttribute('aria-label', playing ? 'Stop music' : 'Play music');
  }
  $('sound').addEventListener('click', e => { e.stopPropagation(); playing ? stop() : start().catch(()=>{}); });
  document.addEventListener('visibilitychange', () => {
    if (!ctx || !playing) return;
    if (document.hidden) { clearTimers(); ctx.suspend(); }
    else { ctx.resume(); playChord(); }
  });

  route();
})();

</script>
</body>
</html>
